name: MedStock Monitor CD

on:
  push:
    branches:
      - main

jobs:
  lint-and-test:
    name: Lint & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Run linter (ESLint)
        run: npx eslint .
        working-directory: backend

      - name: Run tests (Jest)
        run: npx jest --forceExit --verbose --coverage
        working-directory: backend

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Run dependency audit (npm audit)
        run: npm audit --audit-level=high --omit=dev
        working-directory: backend

  iac-scan:
    name: IaC Security Scan (Checkov)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov IaC scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          output_format: cli
          output_file_path: checkov-results.txt
          soft_fail: false
          config_file: .checkov.yaml

      - name: Upload Checkov scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkov-results
          path: checkov-results.txt
          retention-days: 7

  build-and-push:
    name: Build, Scan and Push to Azure Container Registry
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-scan, iac-scan]

    outputs:
      image-tag: ${{ steps.set-tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag using commit SHA
        id: set-tag
        run: echo "tag=${{ secrets.ACR_LOGIN_SERVER }}/medstock-monitor:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Docker image
        run: docker build -f Dockerfile -t ${{ steps.set-tag.outputs.tag }} ./backend

      - name: Scan image with Trivy before pushing
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.set-tag.outputs.tag }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

      - name: Push image to Azure Container Registry
        run: docker push ${{ steps.set-tag.outputs.tag }}

  deploy:
    name: Deploy to Azure VM via Ansible
    runs-on: ubuntu-latest
    needs: [build-and-push]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Ansible and required collections
        run: |
          pip install ansible --break-system-packages
          ansible-galaxy collection install community.docker community.general

      - name: Write SSH private key
        run: |
          echo "${{ secrets.VM_SSH_KEY }}" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key

      - name: Create production inventory with bastion jump host
        run: |
          cat > /tmp/inventory.ini << EOF
          [medstock]
          ${{ secrets.VM_PRIVATE_IP }} ansible_user=${{ secrets.VM_USER }} ansible_ssh_common_args='-o StrictHostKeyChecking=no -o ProxyCommand="ssh -W %h:%p -q -i /tmp/ssh_key -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${{ secrets.BASTION_HOST }}"'

          [medstock:vars]
          ansible_ssh_private_key_file=/tmp/ssh_key
          EOF

      - name: Debug - inspect BASTION_HOST secret for hidden characters
        run: |
          echo -n "${{ secrets.BASTION_HOST }}" | wc -c
          echo -n "${{ secrets.BASTION_HOST }}" | xxd | head -5

      - name: Debug - test connectivity to target via bastion
        run: |
          ssh -i /tmp/ssh_key -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${{ secrets.BASTION_HOST }} \
            "nc -zv -w5 ${{ secrets.VM_PRIVATE_IP }} 22 || echo UNREACHABLE"

      - name: Run Ansible deployment playbook
        run: |
          ansible-playbook -i /tmp/inventory.ini ansible/site.yml \
            --extra-vars "app_image=${{ needs.build-and-push.outputs.image-tag }}" \
            --extra-vars "vault_db_password=${{ secrets.DB_PASSWORD }}" \
            --extra-vars "vault_ghcr_token=${{ secrets.ACR_PASSWORD }}" \
            --extra-vars "github_org=${{ secrets.ACR_USERNAME }}"

      - name: Clean up sensitive files
        if: always()
        run: rm -f /tmp/ssh_key /tmp/inventory.ini